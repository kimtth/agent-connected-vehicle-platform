title = "Agentic Connected Car Platform gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Allow the public Azure Cosmos DB Emulator key in .env* files and setup docs"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^C2y6yDjf5/R\+ob0N8A7Cgv30VRDJIWEHLM\+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==$''',
]
paths = [
  '''(^|.*/)\.env(\..*)?$''',
  '''^temp/.*\.md$''',
]